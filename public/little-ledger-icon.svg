<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Little Ledger · Cadence icon
    Italic monogram "ll" + small mauve dot.
    Background: dark mauve gradient (paper → dusk).
    Letterform: Cormorant Garamond italic (or fallback serif italic).
    Accent: muted mauve dot (top-right).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2530"/>
      <stop offset="100%" stop-color="#3a2d3e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9d2a8"/>
      <stop offset="100%" stop-color="#d4a24a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="256" y="356"
        font-family="'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif"
        font-size="320"
        font-style="italic"
        font-weight="500"
        fill="url(#gold)"
        text-anchor="middle"
        letter-spacing="-12">ll</text>
  <circle cx="394" cy="143" r="14" fill="#c6a8c9" opacity="0.9"/>
</svg>
